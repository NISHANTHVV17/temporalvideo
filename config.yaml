indexing:
  sample_fps: 3.0
  max_dimension: 640
  scene_cut_threshold: 0.42
  resume: true
  cache_dir: .temporalvideo_cache
  database_dir: .temporalvideo_db
tracking:
  backend: auto
  detector_model: yolo11n.pt
  confidence: 0.25
  max_track_gap_seconds: 5.0
reid:
  merge_similarity: 0.82
  max_exit_reentry_seconds: 600.0
  cross_shot: true
events:
  stationary_epsilon: 0.025
  stationary_seconds: 8.0
  interaction_distance: 0.12
query:
  before_after_seconds: 10.0
  vlm_candidate_limit_seconds: 20.0
  low_confidence_threshold: 0.35
semantic:
  enabled: true
  model: openai/clip-vit-base-patch32
  provider: auto
  embedding_fps: 1.0
  device: CPU
verify:
  fps: 12.0
  padding_seconds: 1.0
audio:
  enabled: true
  ffmpeg: ffmpeg
vlm:
  backend: auto
  local_model: Qwen/Qwen2.5-VL-3B-Instruct
  summary_backend: twelvelabs
  twelvelabs_model: pegasus1.6
app:
  max_upload_seconds: 120
  max_upload_bytes: 1000000000
